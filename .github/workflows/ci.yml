name: TSAgent Quality Gate

on:
  push:
  pull_request:

# 默认门禁必须离线：屏蔽真实 Provider 凭据并强制本地 ollama（不可达
# 地址让任何误触 Provider 的用例快速失败）。workflow 级 env 让 Python
# job 和 Desktop job 共享同一配置 — Desktop 的 smoke 会拉起真实 Python
# sidecar 子进程并继承这些变量。
env:
  TSAGENT_ALLOW_LOCAL_EXECUTION: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OPENAI_API_KEY: ""
  LLM_API_KEY: ""
  P2_SECONDARY_API_KEY: ""
  TSAGENT_LLM_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://127.0.0.1:1/v1"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Offline regression tests
        run: python -m pytest -q tests --ignore=tests/test_tools_execution.py -m "not host_integration"

      - name: Host capability tests
        run: python -m pytest -q tests -m host_integration

      - name: Offline tool tests
        run: python -m pytest -q tests/test_tools_execution.py -k "not web_search and not web_fetch"

      - name: Contract Verification
        run: python evaluation/benchmark/contract_verification.py

      - name: Run Checkpoint Contract Validation
        run: python -m benchmarks.checkpoint.validate

      - name: Architecture Verification
        run: python evaluation/architecture_verification.py

      - name: Static cross-module contract checks
        run: python -m mypy --config-file mypy.ini agent/conversation/state.py agent/conversation/__init__.py agent/orchestrator/planner.py

      - name: Reflection and Decision benchmarks
        run: |
          python evaluation/benchmark/eval_reflection.py
          python evaluation/benchmark/eval_decision.py

      - name: Trend Gate
        run: python evaluation/benchmark/trend_gate.py

  desktop-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck and unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Orbit and scene contract scripts
        working-directory: apps/desktop
        run: npm run test:orbits && npm run test:scenes

      - name: Production build
        working-directory: apps/desktop
        run: npm run build

  tauri-host-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # generate_context! resolves frontendDist at compile time; the host
      # unit tests do not serve the frontend, so an empty dist suffices.
      - name: Host unit tests
        working-directory: apps/desktop/src-tauri
        run: mkdir -p ../dist && cargo test --locked
